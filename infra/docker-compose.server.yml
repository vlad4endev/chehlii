# Серверная конфигурация (VPS 77.93.125.36, изолированный проект `chehlii`).
# Запуск:  docker compose -p chehlii --env-file .env.server -f docker-compose.server.yml up -d --build
# Отличия от локальной: postgres/redis НЕ публикуются на host (только внутри сети проекта),
# backend слушает свободный host-порт 8090 → его проксирует nginx_proxy_manager по домену.
name: chehlii

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env.server
    ports:
      - "8090:8000"   # host:container — NPM форвардит домен на 8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
