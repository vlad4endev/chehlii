# Серверная конфигурация (VPS 77.93.125.36, изолированный проект `chehlii`).
# Запуск:  docker compose -p chehlii --env-file .env.server -f docker-compose.server.yml up -d --build
# Отличия от локальной: postgres/redis НЕ публикуются на host (только внутри сети проекта),
# backend слушает свободный host-порт 8090 → его проксирует nginx_proxy_manager по домену.
name: chehlii

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env.server
    environment:
      WEBROOT: /app/webroot          # backend отдаёт мини-приложение (SPA) с того же домена
    ports:
      - "8090:8000"   # host:container — NPM форвардит домен на 8090
    volumes:
      - ./webroot:/app/webroot:ro    # сюда rsync'ится собранный фронт (dist)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # Telegram-бот: тонкий фронтенд, ходит в тот же серверный backend (одна БД).
  bot:
    build:
      context: ..
      dockerfile: bots/Dockerfile
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      BACKEND_URL: http://backend:8000/api/v1   # внутри compose-сети, не через NPM
      REDIS_URL: redis://redis:6379/1
      WEBAPP_URL: https://test.skypath.fun
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
